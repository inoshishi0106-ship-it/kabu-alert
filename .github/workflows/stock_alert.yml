name: stock-alert

on:
  # 15分ごとの起動は cron-job.org が行う（GitHub側の自動起動と二重にならないよう、ここには書かない）
  workflow_dispatch:   # cron-job.org と、手動で動かすボタン

permissions:
  contents: write

concurrency:
  group: stock-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 順番待ちのあとでも、最新の記録を読み込む
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 株の材料チェック
        run: python stock_alert.py --send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_PRIVATE_WEBHOOK: ${{ secrets.DISCORD_PRIVATE_WEBHOOK }}
          WATCH_CODES: ${{ secrets.WATCH_CODES }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      - name: 記録を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add alert_state.json jpx_codes.json edinet_codes.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "記録の保存に失敗しました（次の実行でやり直します）"
