name: stock-alert

on:
  schedule:
    # 日本時間 6:00〜23:45 に15分ごと（GitHubの時計は日本時間-9時間）
    - cron: "*/15 21-23,0-14 * * *"
  workflow_dispatch:   # 手動で動かすボタン

permissions:
  contents: write

concurrency:
  group: stock-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 株の材料チェック
        run: python stock_alert.py --send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: 記録を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add alert_state.json jpx_codes.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
